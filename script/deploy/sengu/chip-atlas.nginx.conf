# nginx site configuration for ChIP-Atlas (sengu stack, Puma backend)
#
# Install:
#   sudo cp chip-atlas.nginx.conf /etc/nginx/conf.d/chip-atlas.conf
#   sudo rm -f /etc/nginx/conf.d/default.conf   # (AL2023 ships this)
#   sudo nginx -t && sudo systemctl reload nginx
#
# For TLS behind an ALB, add X-Forwarded-Proto trust and redirect;
# this config handles plain HTTP for direct-IP test access.

upstream puma {
    server 127.0.0.1:9292 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name _;

    root /home/ec2-user/chip-atlas/public;
    client_max_body_size 16m;

    # ── MIME type for YAML (OpenAPI spec) ──
    types {
        text/yaml yaml yml;
    }

    # ── gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/yaml image/svg+xml;

    # ── Static assets (JS/CSS/images built offline) ──
    location ^~ /js/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @app;
    }
    location ^~ /css/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @app;
    }
    location ^~ /images/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @app;
    }
    location ^~ /examples/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # ── Health check — short timeouts so the ALB probe stays fast ──
    location = /health {
        proxy_pass http://puma;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # ── App (Puma) ──
    location @app {
        proxy_pass http://puma;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Default: try static file, then proxy to app ──
    location / {
        try_files $uri @app;
    }
}
