name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Ruby syntax check
        run: |
          find . -name '*.rb' -not -path './vendor/*' | xargs -n1 ruby -c

      - name: Set up database
        run: bundle exec rake db:migrate

      # The Ruby suite must never make a real outbound request (see
      # lib/services/data_proxy.rb, colo_tsv.rb, target_genes_tsv.rb,
      # bed_extension_resolver.rb - all have a raise_if_unstubbed_under_test!
      # guard for this). Locally that's enforced by running the suite in a
      # `docker run --network none` container (script/dev/test.sh); this
      # runner isn't containerized, so block egress at the firewall for the
      # duration of the test step instead, and restore it unconditionally
      # afterwards so later steps (npm ci, etc.) still have network access.
      - name: Isolate network for Ruby test suite
        run: |
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -j DROP

      - name: Run test suite
        run: bundle exec ruby -Itest -e 'Dir.glob("./test/**/*_test.rb").sort.each { |f| require f }'

      - name: Restore network
        if: always()
        run: sudo iptables -F OUTPUT

      - name: Build frontend
        run: |
          npm ci
          npx tsc --noEmit -p frontend/tsconfig.json
          npx tsc --noEmit -p frontend/tsconfig.test.json
          NODE_ENV=production npm run build

      - name: Run frontend unit tests
        run: bash script/dev/test-frontend.sh

      - name: Boot app and verify endpoints
        run: |
          bundle exec rackup -p 9292 -D -P tmp/rackup.pid
          sleep 3

          # Verify /health returns 200
          health_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9292/health)
          if [ "$health_status" != "200" ]; then
            echo "FAIL: /health returned $health_status"
            curl -s http://localhost:9292/health
            kill $(cat tmp/rackup.pid) 2>/dev/null || true
            exit 1
          fi
          echo "OK: /health returned 200"
          curl -s http://localhost:9292/health | python3 -m json.tool

          # Verify / returns 200
          root_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9292/)
          if [ "$root_status" != "200" ]; then
            echo "FAIL: / returned $root_status"
            kill $(cat tmp/rackup.pid) 2>/dev/null || true
            exit 1
          fi
          echo "OK: / returned 200"

          kill $(cat tmp/rackup.pid) 2>/dev/null || true

      - name: Validate nginx config syntax
        continue-on-error: true
        run: |
          sudo apt-get install -y nginx-core
          sudo cp config/nginx/chip-atlas.conf /etc/nginx/sites-available/chip-atlas
          sudo ln -sf /etc/nginx/sites-available/chip-atlas /etc/nginx/sites-enabled/chip-atlas
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
