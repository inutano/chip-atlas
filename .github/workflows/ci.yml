name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # the Ruby version comes from .ruby-version
          bundler-cache: true

      - name: Ruby syntax check
        run: |
          find . -name '*.rb' -not -path './vendor/*' | xargs -n1 ruby -c

      - name: Set up database
        run: bundle exec rake db:migrate

      - name: Boot app and verify endpoints
        run: |
          mkdir -p tmp
          bundle exec rackup -p 9292 > tmp/rackup.log 2>&1 &
          pid=$!
          # The same script runs locally: bash script/test/docker-smoke.sh
          if ! bash script/test/smoke.sh http://localhost:9292; then
            echo "--- rackup log ---"
            cat tmp/rackup.log
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true

      - name: Validate nginx config syntax
        continue-on-error: true
        run: |
          sudo apt-get install -y nginx-core
          sudo cp config/nginx/chip-atlas.conf /etc/nginx/sites-available/chip-atlas
          sudo ln -sf /etc/nginx/sites-available/chip-atlas /etc/nginx/sites-enabled/chip-atlas
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
